er:rgba(27,31,35,0.06);--color-calendar-graph-day-L3-border:rgba(27,31,35,0.06);--color-calendar-graph-day-L2-border:rgba(27,31,35,0.06);--color-calendar-graph-day-L1-border:rgba(27,31,35,0.06)}.no-animations *{transition-delay:0s!important;transition-duration:0s!important;animation-delay:-.0001s!important;animation-duration:0s!important;animation-play-state:paused!important;caret-color:transparent!important}</style>
    <style>/* Base typography and foreground */
svg {
 font-family:
 "SFMono-Regular",
 Consolas,
 "Liberation Mono",
 monospace;
 color: #cbd5e1;
}

/* Card surface: grid, ambient light, dark base */
.items-wrapper {
 box-sizing: border-box;
 padding: 10px;
 overflow: hidden;

 background:
 linear-gradient(
 rgba(34, 211, 238, 0.035) 1px,
 transparent 1px
 ),
 linear-gradient(
 90deg,
 rgba(34, 211, 238, 0.035) 1px,
 transparent 1px
 ),
 radial-gradient(
 ellipse at top right,
 rgba(124, 58, 237, 0.18),
 transparent 65%
 ),
 #080b14;

 background-size:
 24px 24px,
 24px 24px,
 100% 100%,
 100% 100%;

 border: 1px solid #334568;
 border-top: 2px solid #22d3ee;
 border-radius: 12px;

 box-shadow:
 inset 0 0 24px rgba(124, 58, 237, 0.08);
}

/* Panel identifier */
.items-wrapper::before {
 content: "BIASIOLO // LANGUAGE DISTRIBUTION";
 display: block;

 margin: 0 0 12px;
 padding: 8px 2px 12px;

 border-bottom: 1px solid #25304b;

 color: #a78bfa;
 font-size: 10px;
 font-weight: 700;
 letter-spacing: 1.3px;
}

/* Headings */
h1,
h2,
h3 {
 color: #22d3ee;
 font-family: inherit;
 font-weight: 600;
}

h1 {
 color: #f1f5f9;
 text-shadow: 0 0 12px rgba(34, 211, 238, 0.18);
}

h2 {
 margin-top: 14px;
}

/* Links and emphasis */
a {
 color: #c084fc;
}

strong,
b {
 color: #f8fafc;
}

/* Data rows */
.field {
 color: #cbd5e1;
 line-height: 1.65;
}

.field svg {
 fill: #22d3ee;
}

.field.error {
 color: #fb7185;
}

.field.error svg {
 fill: #fb7185;
}

.field.warning {
 color: #fde047;
}

.field.warning svg {
 fill: #fde047;
}

/* Profile accent */
.avatar {
 border: 1px solid #a78bfa;
 box-shadow: 0 0 10px rgba(167, 139, 250, 0.2);
}

/* Supporting text */
small,
.h-details,
footer {
 color: #94a3b8;
}

footer {
 border-top: 1px solid #25304b;
 margin-top: 12px;
 padding-top: 10px;
}</style>
    <foreignObject x="0" y="0" width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml" xmlns:xlink="http://www.w3.org/1999/xlink" class="items-wrapper">
            <section>
                <h2 class="field">
