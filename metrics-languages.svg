                    </svg>
                    0 Languages
                </h2>
            </section>
            <section class="column">
                <h3 class="field">Most used languages</h3>
                <div class="row fill-width">
                    <section>
                    </section>
                    <section>
                    </section>
                </div>
            </section>
        </div>
        <div xmlns="http://www.w3.org/1999/xhtml" id="metrics-end"></div>
    </foreignObject>
