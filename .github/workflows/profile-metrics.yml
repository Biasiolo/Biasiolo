name: Cyberpunk profile metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  render:
    name: Render ${{ matrix.panel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        include:
          - panel: ACCOUNT OVERVIEW
            kind: stats
            filename: metrics-stats.svg
            base: header, activity, repositories

          - panel: LANGUAGE DISTRIBUTION
            kind: languages
            filename: metrics-languages.svg
            base: ""

          - panel: CONTRIBUTION SIGNAL
            kind: activity
            filename: metrics-activity.svg
            base: ""

    steps:
      # ───────────── STATISTICS & ACTIVITY ─────────────

      - name: Generate statistics or activity
        if: matrix.kind != 'languages'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.event.repository.default_branch }}

          user: Biasiolo
          template: classic
          filename: ${{ matrix.filename }}
          base: ${{ matrix.base }}

          config_timezone: America/Sao_Paulo
          config_animations: "no"
          config_order: base, isocalendar, activity

          plugin_isocalendar: ${{ matrix.kind == 'activity' }}
          plugin_isocalendar_duration: full-year

          plugin_activity: ${{ matrix.kind == 'activity' }}
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_filter: all

          extras_css: |
            svg {
              font-family:
                Consolas,
                "Liberation Mono",
                monospace;
              color: #cbd5e1;
            }

            .items-wrapper {
              box-sizing: border-box;
              padding: 10px;
              overflow: hidden;

              background:
                linear-gradient(
                  rgba(34, 211, 238, 0.035) 1px,
                  transparent 1px
                ),
                linear-gradient(
                  90deg,
                  rgba(34, 211, 238, 0.035) 1px,
                  transparent 1px
                ),
                radial-gradient(
                  ellipse at top right,
                  rgba(124, 58, 237, 0.18),
                  transparent 65%
                ),
                #080b14;

              background-size:
                24px 24px,
                24px 24px,
                100% 100%,
                100% 100%;

              border: 1px solid #334568;
              border-top: 2px solid #22d3ee;
              border-radius: 12px;
            }

            .items-wrapper::before {
              content: "BIASIOLO // ${{ matrix.panel }}";
              display: block;
              margin-bottom: 12px;
              padding: 8px 2px 12px;
              border-bottom: 1px solid #25304b;
              color: #a78bfa;
              font-size: 10px;
              font-weight: 700;
              letter-spacing: 1.3px;
            }

            h1,
            h2,
            h3 {
              color: #22d3ee;
              font-family: inherit;
              font-weight: 600;
            }

            h1 {
              color: #f1f5f9;
            }

            h2 {
              margin-top: 14px;
            }

            a {
              color: #c084fc;
            }

            strong,
            b {
              color: #f8fafc;
            }

            .field {
              color: #cbd5e1;
              line-height: 1.65;
            }

            .field svg {
              fill: #22d3ee;
            }

            .field.error {
              color: #fb7185;
            }

            .field.error svg {
              fill: #fb7185;
            }

            .field.warning {
              color: #fde047;
            }

            .field.warning svg {
              fill: #fde047;
            }

            .avatar {
              border: 1px solid #a78bfa;
            }

            small,
            .h-details,
            footer {
              color: #94a3b8;
            }

            footer {
              border-top: 1px solid #25304b;
              margin-top: 12px;
              padding-top: 10px;
            }

      # ───────────── LANGUAGES / DIRECT GITHUB API ─────────────

      - name: Checkout profile repository
        if: matrix.kind == 'languages'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Collect languages and generate cyberpunk SVG
        if: matrix.kind == 'languages'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3

          script: |
            const fs = require("node:fs/promises");
            const username = "Biasiolo";

            // Fetch every public repository owned by this user.
            const allRepos = await github.paginate(
              github.rest.repos.listForUser,
              {
                username,
                type: "owner",
                per_page: 100,
                sort: "full_name"
              }
            );

            // Include archived repositories; exclude forks and empty repos.
            const repos = allRepos.filter(repo =>
              !repo.fork &&
              !repo.private &&
              repo.size > 0
            );

            const totals = new Map();

            for (const repo of repos) {
              const { data } = await github.rest.repos.listLanguages({
                owner: repo.owner.login,
                repo: repo.name
              });

              for (const [language, bytes] of Object.entries(data)) {
                totals.set(
                  language,
                  (totals.get(language) || 0) + bytes
                );
              }
            }

            const sorted = [...totals.entries()]
              .sort((a, b) => b[1] - a[1]);

            const totalBytes = sorted.reduce(
              (sum, [, bytes]) => sum + bytes,
              0
            );

            // Fail instead of publishing a misleading empty card.
            if (!totalBytes) {
              throw new Error(
                "No language data returned. Previous SVG was preserved."
              );
            }

            // Show up to eight rows, grouping remaining languages.
            let rows = sorted;

            if (sorted.length > 8) {
              rows = [
                ...sorted.slice(0, 7),
                [
                  "Other",
                  sorted.slice(7).reduce(
                    (sum, [, bytes]) => sum + bytes,
                    0
                  )
                ]
              ];
            }

            const colors = {
              JavaScript: "#fde047",
              TypeScript: "#22d3ee",
              HTML: "#fb7185",
              CSS: "#c084fc",
              SCSS: "#f472b6",
              Sass: "#f472b6",
              Python: "#34d399",
              Shell: "#a3e635",
              Vue: "#2dd4bf",
              PHP: "#a5b4fc",
              Java: "#fb923c",
              Go: "#67e8f9",
              Ruby: "#f87171",
              Other: "#64748b"
            };

            const escape = value => String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&apos;");

            const width = 680;
            const height = 206 + rows.length * 40;
            const barWidth = width - 48;
            let offset = 24;

            const segments = rows.map(([language, bytes]) => {
              const segmentWidth = bytes / totalBytes * barWidth;
              const color = colors[language] || "#818cf8";

              const segment = `
                <rect
                  x="${offset.toFixed(3)}"
                  y="114"
                  width="${segmentWidth.toFixed(3)}"
                  height="10"
                  fill="${color}"
                />
              `;

              offset += segmentWidth;
              return segment;
            }).join("");

            const languageRows = rows.map(
              ([language, bytes], index) => {
                const y = 162 + index * 40;
                const percent = (bytes / totalBytes * 100).toFixed(1);
                const color = colors[language] || "#818cf8";

                return `
                  <circle cx="30" cy="${y - 5}" r="4" fill="${color}" />

                  <text x="46" y="${y}" fill="#e2e8f0" font-size="15">
                    ${escape(language)}
                  </text>

                  <text
                    x="656"
                    y="${y}"
                    fill="${color}"
                    font-size="15"
                    text-anchor="end"
                  >${percent}%</text>

                  <line
                    x1="24"
                    y1="${y + 13}"
                    x2="656"
                    y2="${y + 13}"
                    stroke="#1e293b"
                  />
                `;
              }
            ).join("");

            const updated = new Date().toISOString().slice(0, 10);

            const svg = `
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="${width}"
              height="${height}"
              viewBox="0 0 ${width} ${height}"
              role="img"
              aria-labelledby="title description"
            >
              <title id="title">Biasiolo — Language distribution</title>
              <desc id="description">
                Public repository languages, weighted by code bytes.
              </desc>

              <defs>
                <pattern
                  id="grid"
                  width="24"
                  height="24"
                  patternUnits="userSpaceOnUse"
                >
                  <path
                    d="M 24 0 L 0 0 0 24"
                    fill="none"
                    stroke="#22d3ee"
                    stroke-opacity="0.055"
                  />
                </pattern>

                <radialGradient id="ambient" cx="100%" cy="0%" r="90%">
                  <stop offset="0%" stop-color="#7c3aed" stop-opacity=".24" />
                  <stop offset="100%" stop-color="#080b14" stop-opacity="0" />
                </radialGradient>

                <clipPath id="card">
                  <rect
                    x="1"
                    y="1"
                    width="${width - 2}"
                    height="${height - 2}"
                    rx="12"
                  />
                </clipPath>

                <clipPath id="bar">
                  <rect x="24" y="114" width="${barWidth}" height="10" rx="5" />
                </clipPath>
              </defs>

              <g clip-path="url(#card)">
                <rect width="100%" height="100%" fill="#080b14" />
                <rect width="100%" height="100%" fill="url(#grid)" />
                <rect width="100%" height="100%" fill="url(#ambient)" />

                <rect width="100%" height="3" fill="#22d3ee" />

                <g font-family="Consolas, Liberation Mono, monospace">
                  <text
                    x="24"
                    y="34"
                    fill="#a78bfa"
                    font-size="11"
                    letter-spacing="1.2"
                  >BIASIOLO // LANGUAGE DISTRIBUTION</text>

                  <line
                    x1="24"
                    y1="50"
                    x2="656"
                    y2="50"
                    stroke="#25304b"
                  />

                  <text
                    x="24"
                    y="88"
                    fill="#f1f5f9"
                    font-size="22"
                    font-weight="700"
                  >The code behind the builds.</text>

                  <g clip-path="url(#bar)">
                    ${segments}
                  </g>

                  ${languageRows}

                  <text
                    x="24"
                    y="${height - 41}"
                    fill="#94a3b8"
                    font-size="11"
                  >${totals.size} languages / ${repos.length} repositories scanned</text>

                  <text
                    x="24"
                    y="${height - 21}"
                    fill="#64748b"
                    font-size="10"
                  >PUBLIC CODE BYTES / UPDATED ${updated} UTC</text>
                </g>
              </g>

              <rect
                x="1"
                y="1"
                width="${width - 2}"
                height="${height - 2}"
                rx="12"
                fill="none"
                stroke="#334568"
              />
            </svg>
            `;

            await fs.writeFile("metrics-languages.svg", svg.trim(), "utf8");

            core.info(`Scanned ${repos.length} public, non-fork repositories.`);
            core.info(`Found ${totals.size} languages.`);
            core.info(
              rows.map(([name, bytes]) =>
                `${name}: ${(bytes / totalBytes * 100).toFixed(1)}%`
              ).join("\n")
            );

      - name: Publish language card
        if: matrix.kind == 'languages'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add metrics-languages.svg

          if git diff --cached --quiet; then
            echo "Language card is already up to date."
            exit 0
          fi

          git commit -m "Update cyberpunk language distribution"
          git pull --rebase
          git push
